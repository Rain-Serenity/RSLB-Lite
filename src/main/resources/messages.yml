# ============================================================
#  RSLB Lite 语言文件 (UTF-8)
#
#  颜色代码使用 '&' 前缀，例如 &a=绿色 &c=红色 &e=黄色 &b=天蓝
#  &l=加粗 &o=斜体 &n=下划线 &r=重置 &8=深灰
#  占位符使用 {名称} 形式，如 {name} {uuid} {count}
#  换行使用 \n
#
#  修改后执行 /rslb reload 生效。
# ============================================================

# ==================== 登录认证 ====================

# 认证服务器网络故障或返回意外结果
auth_yggdrasil_failed_server_down: "&8[&b&lRSLBL&8]&r&c由于服务器网络问题，或是账户验证服务器返回了个意料之外的结果，导致暂时不能验证您的会话信息，请重试。"

# 会话无效（客户端外置登录配置不正确）
auth_yggdrasil_failed_validation_failed: "&8[&b&lRSLBL&8]&r&c无效的会话，请检查客户端外置登录配置。"

# 处理登录数据时出错
auth_yggdrasil_error: "&8[&b&lRSLBL&8]&r&c在处理您的登录数据时出现问题，请与服务器管理员取得联系。"

# 服务器未配置任何验证服务
auth_failed_no_yggdrasil_service: "&8[&b&lRSLBL&8]&r&c服务器尚未添加任何世界树验证服务器，请尝试与服务器管理员取得联系。"

# 未知错误
auth_yggdrasil_failed_unknown: "&8[&b&lRSLBL&8]&r&c未知的错误，请与服务器管理员取得联系。"

# 验证判断过程出错
auth_validate_error: "&8[&b&lRSLBL&8]&r&c在判断您是否能登录到这个服务器时出现了错误，请与服务器管理员取得联系。"

# 用户名与正则不匹配
auth_validate_failed_username_mismatch: "&8[&b&lRSLBL&8]&r&c您使用的名字 &e{name}&c 与正则 &e{regular}&c 不匹配，请更改。"

# 需要经过登录验证才能进入
auth_handler_need_use_login: "&8[&b&lRSLBL&8]&r&c您需要通过 &eRSereneLogin &c的验证来进入这个服务器，如有疑问，请与服务器管理员取得联系。"

# ==================== 入服消息 ====================

# 欢迎消息（未注册档案）
welcome_msg_to_unknown: "&8[&b&lRSLBL&8]&r&a吼吼吼，欢迎 &e{profile_name} &a加入服务器！！！"

# 欢迎消息
welcome_msg: "&8[&b&lRSLBL&8]&r&a欢迎 &e{online_name} &a加入服务器！您通过 &e{service_name} &a加入服务器，当前游戏内档案为 &e{profile_name}&a。"

# ==================== 指令通用 ====================

# 执行指令时发生异常
command_error: "&8[&b&lRSLBL&8]&r&c处理用户指令时发生异常，请与服务器管理员取得联系。"

