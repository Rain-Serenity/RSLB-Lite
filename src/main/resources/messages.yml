command_message_cache_not_found_other: "&8[&b&lRSLBL&8]&r&c不能获取玩家 &8[&e{uuid}&8](&e{name}&8) 的登录数据，ta是用猫踢螺钉来登录的嘛？"

# ==================== 查询 (info) ====================

# 身份不明的名字
command_message_info_unidentified_name: "&8[&b&lRSLBL&8]&r&8身份不明的"

# 检索到多个相似在线玩家
command_message_info_multi: "&8[&b&lRSLBL&8]&r&c寻找到有 &e{0} &c名玩家的游戏ID相似并且同时在线，结果将在下方显示，请注意谨慎使用有关填入玩家名称的指令。"

# 绕过登录无法查询的玩家
command_message_info_unknown: "&8[&b&lRSLBL&8]&r&a玩家 &8[&e{uuid}&8](&e{name}&8) &a绕过登录信息无法被查询。"

# 玩家登录信息
command_message_info: "&8[&b&lRSLBL&8]&r&a玩家 &8(&e{name}&8)[&e{uuid}&8]&a &a的登录方式是 &e{service_name}&8(sid = &e{service_id}&8)&a  &a原始身份为 &a&8(&e{online_name}&8)[&e{online_uuid}&8]"

# ==================== 指令帮助 ====================

# 帮助列表头部（{count} = 可用指令数量）
