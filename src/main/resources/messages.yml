command_message_error_header: "&8[&b&lRSLBL&8]&r&c"

# 没有权限使用指令
command_message_no_permission: "&8[&b&lRSLBL&8]&r&c你没有权限使用此指令"

# 指令只能由玩家执行
command_message_require_player: "&8[&b&lRSLBL&8]&r&c这个指令只能由玩家执行。"

# 配置文件重载完成
command_message_reloaded: "&8[&b&lRSLBL&8]&r&a所有文件已重新加载。"

